name: nemotron3_ultra_tinker_full_2026_07
description: NVIDIA Nemotron 3 Ultra via Tinker across all chi-Bench tasks in the three benchmark domains.

defaults:
  environment: modal
  env_file: .env
  concurrency: 5
  n_attempts: 1
  max_retries: 2
  trials_root: logs/experiments/nemotron3_ultra_tinker_full_2026_07
  agent_timeout_multiplier: 2.0

domains:
  pa_provider:
    dataset: data/prior_auth_provider/tasks
    registry_path: data/prior_auth_provider/registry.json
  pa_um:
    dataset: data/prior_auth_um/tasks
    registry_path: data/prior_auth_um/registry.json
  cm:
    dataset: data/care_management/tasks
    registry_path: data/care_management/registry.json

rows:
  - agent: openai-agents
    model: "nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16:peft:262144"
    agent_kwargs:
      provider_route: tinker
      api_mode: chat_completions
      max_turns: "50"
      max_retries: "10"
      max_tool_return_chars: "100000"
