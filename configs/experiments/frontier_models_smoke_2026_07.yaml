name: frontier_models_smoke_2026_07
description: Six model cells x one representative task in each chi-Bench domain.

defaults:
  environment: docker
  env_file: .env
  trials_root: logs/experiments/frontier_models_smoke_2026_07
  agent_timeout_multiplier: 2.0

domains:
  pa_provider:
    dataset: data/prior_auth_provider/tasks/pa_t014_t014_o001_p01_new_referral_provider
  pa_um:
    dataset: data/prior_auth_um/tasks/pa_t034_t034_o002_p01_intake_payer
  cm:
    dataset: data/care_management/tasks/cm_afib_moderate_anxious_001

rows:
  - agent: claude-code
    model: anthropic/claude-fable-5
    agent_kwargs:
      version: "2.1.216"
      reasoning_effort: high

  - agent: codex
    model: openai/gpt-5.6-sol
    agent_kwargs:
      version: "0.145.0"
      reasoning_effort: high
      reasoning_summary: auto

  - agent: codex
    model: openai/gpt-5.6-terra
    agent_kwargs:
      version: "0.145.0"
      reasoning_effort: high
      reasoning_summary: auto

  - agent: codex
    model: openai/gpt-5.6-luna
    agent_kwargs:
      version: "0.145.0"
      reasoning_effort: high
      reasoning_summary: auto

  - agent: openai-agents
    model: moonshotai/kimi-k3
    agent_kwargs:
      max_turns: "50"
      max_retries: "10"
      max_tool_return_chars: "100000"

  - agent: openai-agents
    model: "thinkingmachines/Inkling:peft:262144"
    agent_kwargs:
      api_mode: chat_completions
      reasoning_effort: high
      max_turns: "50"
      max_retries: "10"
      max_tool_return_chars: "100000"
