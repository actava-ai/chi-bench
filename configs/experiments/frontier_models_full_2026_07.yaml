name: frontier_models_full_2026_07
description: Five frontier model cells across all chi-Bench tasks in the three benchmark domains.

defaults:
  environment: modal
  env_file: .env
  concurrency: 5
  n_attempts: 1
  max_retries: 2
  trials_root: logs/experiments/frontier_models_full_2026_07
  agent_timeout_multiplier: 2.0

domains:
  pa_provider:
    dataset: data/prior_auth_provider/tasks
    registry_path: data/prior_auth_provider/registry.json
  pa_um:
    dataset: data/prior_auth_um/tasks
    registry_path: data/prior_auth_um/registry.json
  cm:
    dataset: data/care_management/tasks
    registry_path: data/care_management/registry.json

rows:
  - agent: codex
    model: openai/gpt-5.6-sol
    agent_kwargs:
      version: "0.145.0"
      reasoning_effort: high
      reasoning_summary: auto

  - agent: codex
    model: openai/gpt-5.6-terra
    agent_kwargs:
      version: "0.145.0"
      reasoning_effort: high
      reasoning_summary: auto

  - agent: codex
    model: openai/gpt-5.6-luna
    agent_kwargs:
      version: "0.145.0"
      reasoning_effort: high
      reasoning_summary: auto

  - agent: openai-agents
    model: moonshotai/kimi-k3
    agent_kwargs:
      max_turns: "50"
      max_retries: "10"
      max_tool_return_chars: "100000"

  - agent: openai-agents
    model: "thinkingmachines/Inkling:peft:262144"
    agent_kwargs:
      api_mode: chat_completions
      reasoning_effort: high
      max_turns: "50"
      max_retries: "10"
      max_tool_return_chars: "100000"
